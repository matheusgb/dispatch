\* Configuracao do modelo original (correto). Espaco de estados pequeno de
\* proposito: 2 writers, 2 entregas, 2 couriers, epoch ate 4. Suficiente
\* para o TLC explorar promocao concorrente, fencing e handoff sem levar
\* horas nesta maquina compartilhada.

CONSTANTS
    Writers = {w1, w2}
    Deliveries = {d1, d2}
    Couriers = {c1, c2}
    MaxEpoch = 4

SPECIFICATION Spec

INVARIANT TypeInvariant
INVARIANT Safety

PROPERTY EventuallyRecovers

CHECK_DEADLOCK FALSE
