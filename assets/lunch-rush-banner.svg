<svg width="2172" height="724" viewBox="0 0 2172 724" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: "Arial Black", "Helvetica Neue", Arial, sans-serif; font-weight: 900; }
    </style>
  </defs>

  <rect width="2172" height="724" fill="#181310"/>

  <!-- word LUNCH-RUSH, top left -->
  <text x="60" y="240" class="title" font-size="150" fill="#fbead2" letter-spacing="-2">LUNCH-RUSH</text>

  <!-- staircase: tier 1 to tier 6, growing in complexity left to right -->
  <line x1="1180" y1="650" x2="2132" y2="650" stroke="#3a2f28" stroke-width="3"/>

  <!-- tier 1 -->
  <rect x="1212" y="560" width="130" height="90" fill="#f2a93c"/>
  <!-- tier 2 -->
  <rect x="1366" y="510" width="130" height="140" fill="#f2a93c"/>
  <!-- tier 3 -->
  <rect x="1520" y="460" width="130" height="190" fill="#f2a93c"/>
  <!-- tier 4 -->
  <rect x="1674" y="410" width="130" height="240" fill="#f2a93c"/>

  <!-- tier 5: split in two, arquitetura celular -->
  <rect x="1828" y="360" width="65" height="290" fill="#f2a93c"/>
  <rect x="1893" y="360" width="65" height="290" fill="none" stroke="#f2a93c" stroke-width="4"/>

  <!-- tier 6: split in two, dois provedores, um writer rejeitado -->
  <rect x="1982" y="310" width="65" height="340" fill="#f2a93c"/>
  <rect x="2047" y="310" width="65" height="340" fill="none" stroke="#e8432c" stroke-width="4"/>
</svg>
