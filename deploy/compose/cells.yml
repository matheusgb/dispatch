# Arquitetura celular local do tier 5 (ver docs/adr/0019-arquitetura-celular-local.md
# e docs/limitacoes-simulacao-local.md). Duas células lógicas, cada uma com
# seu próprio delivery-api e seu próprio banco de dados (dispatch_cell_a e
# dispatch_cell_b), rodando no MESMO container PostgreSQL já usado pelo
# resto do laboratório: isolamento de dados real (bancos diferentes,
# nenhuma tabela compartilhada, cell_id nunca cruza banco), mas não
# isolamento físico de processo de banco, rede ou hardware — rotulado
# honestamente como isolamento lógico, exatamente como
# docs/limitacoes-simulacao-local.md já previa antes deste tier começar.
#
# Uso:
#   docker compose -f docker-compose.yml -f deploy/compose/cells.yml \
#     --profile app --profile cells up -d --build delivery-api-cell-a delivery-api-cell-b cellrouter
#
# As duas databases (dispatch_cell_a, dispatch_cell_b) e suas migrations
# são criadas manualmente antes de subir (não automatizado neste arquivo
# para não duplicar o serviço `migrate` por célula só para este
# experimento local — ver docs/passo-a-passo/tier-5.md para o comando
# exato).
services:
  delivery-api-cell-a:
    profiles: ["cells"]
    build:
      context: .
      dockerfile: deploy/compose/Dockerfile.delivery-api
    environment:
      DATABASE_URL: postgres://dispatch:dispatch@postgres:5432/dispatch_cell_a?sslmode=disable
      HTTP_ADDR: ":8080"
      DISPATCH_JWT_SECRET: compose-dev-secret
      DISPATCH_ADMIN_SECRET: compose-dev-admin-secret
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8094:8080"

  delivery-api-cell-b:
    profiles: ["cells"]
    build:
      context: .
      dockerfile: deploy/compose/Dockerfile.delivery-api
    environment:
      DATABASE_URL: postgres://dispatch:dispatch@postgres:5432/dispatch_cell_b?sslmode=disable
      HTTP_ADDR: ":8080"
      DISPATCH_JWT_SECRET: compose-dev-secret
      DISPATCH_ADMIN_SECRET: compose-dev-admin-secret
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8095:8080"

  cellrouter:
    profiles: ["cells"]
    build:
      context: .
      dockerfile: deploy/compose/Dockerfile.cellrouter
    environment:
      HTTP_ADDR: ":8080"
      DEFAULT_CELL_ID: "cell-a"
      CELLS: "cell-a=http://delivery-api-cell-a:8080,cell-b=http://delivery-api-cell-b:8080"
    ports:
      - "8096:8080"
    depends_on:
      - delivery-api-cell-a
      - delivery-api-cell-b
