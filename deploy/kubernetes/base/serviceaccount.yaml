# Uma conta por workload, sem nenhuma permissão de API do Kubernetes: nada
# aqui precisa falar com o control plane. automountServiceAccountToken
# desligado é a forma de declarar isso explicitamente, não só por omissão.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dispatch-workload
  namespace: dispatch
automountServiceAccountToken: false
