# Secret de desenvolvimento local, versionado de propósito só porque o
# valor não protege nada real (kind local, sem dado sensível). Em qualquer
# ambiente que não seja este laboratório, isto vem de um cofre de segredos
# (Secrets Manager, Vault, SOPS), nunca de um arquivo no repositório: ver
# docs/limitacoes-simulacao-local.md.
apiVersion: v1
kind: Secret
metadata:
  name: lunchrush-secrets
  namespace: lunchrush
type: Opaque
stringData:
  LUNCHRUSH_JWT_SECRET: kind-dev-jwt-secret
  LUNCHRUSH_ADMIN_SECRET: kind-dev-admin-secret
