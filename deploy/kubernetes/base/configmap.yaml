apiVersion: v1
kind: ConfigMap
metadata:
  name: lunchrush-config
  namespace: lunchrush
data:
  KAFKA_BROKERS: "redpanda-external:9092"
  DATABASE_URL: "postgres://lunchrush:lunchrush@postgres-external:5432/lunchrush?sslmode=disable"
  REDIS_ADDR: "redis-external:6379"
  NOTIFICATION_PROVIDER_URL: "http://dependency-simulator-external:8092"
  OFFER_TTL_SECONDS: "120"
