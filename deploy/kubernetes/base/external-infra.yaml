# Infra compartilhada (PostgreSQL, Redis, Redpanda, dependency-simulator)
# continua fora do cluster neste tier: roda no docker compose do host, como
# qualquer serviço gerenciado externo faria. Cada par Service/Endpoints
# abaixo é o único acoplamento entre o cluster kind e essa infra.
#
# Um Service comum sem selector, com um Endpoints apontando para um IP
# literal, é o jeito correto de referenciar algo fora do cluster: um
# Service do tipo ExternalName exige um nome DNS, não aceita IP (o CoreDNS
# devolve "server misbehaving" para um CNAME que é um endereço). O IP real
# (gateway docker do host, que muda por ambiente) é escrito por
# scripts/kind-deploy.sh no lugar de HOST_GATEWAY_IP.
apiVersion: v1
kind: Service
metadata:
  name: postgres-external
  namespace: lunchrush
spec:
  ports:
    - port: 5432
---
apiVersion: v1
kind: Endpoints
metadata:
  name: postgres-external
  namespace: lunchrush
subsets:
  - addresses:
      - ip: HOST_GATEWAY_IP
    ports:
      - port: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: redis-external
  namespace: lunchrush
spec:
  ports:
    - port: 6379
---
apiVersion: v1
kind: Endpoints
metadata:
  name: redis-external
  namespace: lunchrush
subsets:
  - addresses:
      - ip: HOST_GATEWAY_IP
    ports:
      - port: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redpanda-external
  namespace: lunchrush
spec:
  ports:
    - port: 9092
---
apiVersion: v1
kind: Endpoints
metadata:
  name: redpanda-external
  namespace: lunchrush
subsets:
  - addresses:
      - ip: HOST_GATEWAY_IP
    ports:
      - port: 9092
---
# O Redpanda do docker compose anuncia a si mesmo como "redpanda:9092"
# (endereço válido dentro da rede do compose). Um cliente Kafka sempre
# reconecta usando o endereço anunciado pelo próprio broker, não o que foi
# usado no bootstrap inicial; sem isso, "redpanda-external" resolveria o
# primeiro contato, mas toda produção/consumo real falharia tentando
# resolver "redpanda" sozinho. Este Service replica o mesmo apontamento
# sob o nome curto "redpanda", que o DNS do pod resolve via search domain
# (redpanda.lunchrush.svc.cluster.local).
apiVersion: v1
kind: Service
metadata:
  name: redpanda
  namespace: lunchrush
spec:
  ports:
    - port: 9092
---
apiVersion: v1
kind: Endpoints
metadata:
  name: redpanda
  namespace: lunchrush
subsets:
  - addresses:
      - ip: HOST_GATEWAY_IP
    ports:
      - port: 9092
---
apiVersion: v1
kind: Service
metadata:
  name: dependency-simulator-external
  namespace: lunchrush
spec:
  ports:
    - port: 8092
---
apiVersion: v1
kind: Endpoints
metadata:
  name: dependency-simulator-external
  namespace: lunchrush
subsets:
  - addresses:
      - ip: HOST_GATEWAY_IP
    ports:
      - port: 8092
