apiVersion: v1
kind: ConfigMap
metadata:
  name: dispatch-config
  namespace: {{ .Values.namespace }}
data:
  KAFKA_BROKERS: "redpanda-external:{{ .Values.externalInfra.redpanda.port }}"
  DATABASE_URL: "postgres://dispatch:dispatch@postgres-external:{{ .Values.externalInfra.postgres.port }}/dispatch?sslmode=disable"
  REDIS_ADDR: "redis-external:{{ .Values.externalInfra.redis.port }}"
  NOTIFICATION_PROVIDER_URL: "http://dependency-simulator-external:{{ .Values.externalInfra.dependencySimulator.port }}"
  OFFER_TTL_SECONDS: {{ .Values.config.offerTTLSeconds | quote }}
