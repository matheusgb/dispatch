# Uma conta única para todos os workloads, sem nenhuma permissão de API do
# Kubernetes: nada aqui precisa falar com o control plane.
# automountServiceAccountToken desligado é a forma de declarar isso
# explicitamente, não só por omissão.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Values.namespace }}
automountServiceAccountToken: false
