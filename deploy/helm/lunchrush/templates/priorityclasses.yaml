# PriorityClass reais para os caminhos críticos (item 12 da auditoria de
# lacunas): delivery-api e lunchrush-worker bloqueiam o caminho síncrono do
# usuário (criar/consultar/despachar uma entrega) e o assíncrono que só
# aparece com atraso perceptível se cair (fila do Kafka crescendo), então
# ganham prioridade alta. tracking-ingest/tracking-projector também
# bloqueiam a experiência do usuário (tracking em tempo real), prioridade
# alta também. notification-worker é assíncrono e não bloqueia nenhum
# caminho crítico (o pior caso de atraso é uma notificação chegando mais
# tarde), fica com prioridade padrão/baixa — o scheduler prefere
# despejar/adiar pods deste antes dos críticos sob pressão de recursos no
# nó (ver `preemptionPolicy` de cada classe).
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: lunchrush-critical
value: 1000000
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: >
  Caminho crítico e síncrono do usuário: delivery-api, lunchrush-worker,
  tracking-ingest, tracking-projector. Pode preemptar pods de prioridade
  mais baixa no mesmo nó sob pressão de recursos.
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: lunchrush-standard
value: 100000
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: >
  Caminho assíncrono, não bloqueia o usuário (notification-worker):
  atraso é tolerável, não é motivo para preemptar um workload crítico.
