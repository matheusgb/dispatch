# Secret de desenvolvimento local, versionado (via values.yaml) de
# propósito só porque o valor não protege nada real (kind local, sem dado
# sensível). Em qualquer ambiente que não seja este laboratório, isto vem
# de um cofre de segredos (Secrets Manager, Vault, SOPS), nunca de um
# values.yaml no repositório: ver docs/limitacoes-simulacao-local.md.
apiVersion: v1
kind: Secret
metadata:
  name: lunchrush-secrets
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  LUNCHRUSH_JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  LUNCHRUSH_ADMIN_SECRET: {{ .Values.secrets.adminSecret | quote }}
