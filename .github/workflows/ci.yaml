name: ci

# Lint, vet, testes de unidade com corrida de dados e build de todos os
# binários de cmd/. Não sobe Postgres/Kafka: os testes de integração (que
# exigem docker compose) rodam só localmente por enquanto, ver
# docs/adr/0024-ci-github-actions-e-onde-ficam-os-templates.md.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  lint-vet-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "arquivos fora do padrão gofmt:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test -race
        run: go test -race ./...

  build-images:
    runs-on: ubuntu-latest
    needs: lint-vet-test
    strategy:
      matrix:
        service:
          - delivery-api
          - lunchrush-worker
          - tracking-ingest
          - tracking-projector
          - notification-worker
          - cellrouter
          - dependency-simulator
          - migrate
    steps:
      - uses: actions/checkout@v4

      - name: build image (sem push, só valida o Dockerfile)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/compose/Dockerfile.${{ matrix.service }}
          push: false
          tags: lunchrush-${{ matrix.service }}:ci
