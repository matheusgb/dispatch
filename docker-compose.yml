services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dispatch
      POSTGRES_PASSWORD: dispatch
      POSTGRES_DB: dispatch
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dispatch"]
      interval: 2s
      timeout: 2s
      retries: 15

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  migrate:
    profiles: ["app"]
    build:
      context: .
      dockerfile: deploy/compose/Dockerfile.migrate
    environment:
      DATABASE_URL: postgres://dispatch:dispatch@postgres:5432/dispatch?sslmode=disable
    command: ["up"]
    depends_on:
      postgres:
        condition: service_healthy

  dependency-simulator:
    profiles: ["app"]
    build:
      context: .
      dockerfile: deploy/compose/Dockerfile.dependency-simulator
    environment:
      HTTP_ADDR: ":8090"
      FAILURE_RATE: "0.1"
      LATENCY_MS: "20"
    ports:
      # 8090 já está ocupada no host por outro laboratório (kind do
      # edge-lab); a porta interna do container continua 8090.
      - "8092:8090"

  delivery-api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: deploy/compose/Dockerfile.delivery-api
    environment:
      DATABASE_URL: postgres://dispatch:dispatch@postgres:5432/dispatch?sslmode=disable
      REDIS_ADDR: redis:6379
      HTTP_ADDR: ":8080"
      DISPATCH_JWT_SECRET: compose-dev-secret
      DISPATCH_ADMIN_SECRET: compose-dev-admin-secret
      NOTIFICATION_PROVIDER_URL: http://dependency-simulator:8090
    ports:
      # 8080 já está ocupada no host por outro laboratório (kind do
      # edge-lab); a porta interna do container continua 8080.
      - "8083:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.0.1
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
