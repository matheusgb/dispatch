openapi: 3.0.3
info:
  title: lunchrush delivery-api
  version: tier-6.0.0
  description: >
    Lifecycle de entrega, cadastro de entregador, atribuição e emissão de
    token do delivery-api (internal/platform/httpapi/server.go). Cobre só
    o delivery-api; tracking-ingest e tracking-projector não estão neste
    documento (endpoints de tracking, ver internal/tracking e
    cmd/tracking-projector/http.go, ficam fora de escopo deste OpenAPI por
    enquanto).
paths:
  /healthz:
    get:
      summary: processo vivo
      responses:
        "200": { description: ok }
  /readyz:
    get:
      summary: processo pronto para tráfego
      responses:
        "200": { description: ok }
  /deliveries:
    post:
      summary: cria uma entrega
      parameters:
        - name: X-Caller
          in: header
          required: true
          schema: { type: string }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      responses:
        "201":
          description: entrega criada, ou repetição da mesma chave com o mesmo payload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Delivery" }
        "409":
          description: mesma chave usada com um payload diferente
        "422":
          description: X-Caller ou Idempotency-Key ausentes
  /deliveries/{id}:
    get:
      summary: consulta uma entrega
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: estado atual da entrega
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Delivery" }
        "404":
          description: entrega não encontrada
  /deliveries/{id}/ready:
    post:
      summary: >
        move created -> ready_for_lunchrush. Em operação normal é o
        lunchrush-worker quem aciona, reagindo a delivery.created; exposto
        também para override manual e testes.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: entrega pronta para despacho }
        "409": { description: entrega não estava em created }
  /deliveries/{id}/offer:
    post:
      summary: move ready_for_lunchrush -> offered com prazo de expiração
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: oferta criada }
        "409": { description: entrega não estava pronta para despacho }
  /deliveries/{id}/assign:
    post:
      summary: aceite concorrente, offered -> assigned
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [courier_id]
              properties:
                courier_id: { type: string }
      responses:
        "204": { description: atribuição confirmada }
        "409":
          description: >
            outra tentativa venceu a disputa, ou o entregador já tem outra
            entrega ativa
  /deliveries/{id}/decline:
    post:
      summary: recusa a oferta e recicla para ready_for_lunchrush
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: recusa registrada }
        "409": { description: entrega não estava em oferta }
  /deliveries/{id}/pickup:
    post:
      summary: entregador coletou o pedido, assigned -> picked_up
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: coleta registrada }
        "409": { description: entrega não estava em assigned }
  /deliveries/{id}/deliver:
    post:
      summary: entrega concluída, picked_up -> delivered (estado terminal)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: entrega concluída }
        "409": { description: entrega não estava em picked_up }
  /auth/tokens:
    post:
      summary: >
        emite um JWT HS256 para caller/tracking-ingest/tracking-projector
        validarem (delivery-api é a identidade raiz do sistema, ver
        docs/adr/0005-tokens-assinados-em-vez-de-oidc.md)
      parameters:
        - name: X-Admin-Secret
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [caller]
              properties:
                caller: { type: string }
      responses:
        "201":
          description: token emitido
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
        "401": { description: X-Admin-Secret ausente ou inválido }
        "422": { description: caller ausente }
  /couriers:
    post:
      summary: cadastra um entregador, indisponível por padrão
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "201":
          description: entregador cadastrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Courier" }
  /couriers/{id}/availability:
    post:
      summary: declara disponibilidade do entregador
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [available]
              properties:
                available: { type: boolean }
      responses:
        "204": { description: disponibilidade atualizada }
        "404": { description: entregador não encontrado }
components:
  schemas:
    Delivery:
      type: object
      properties:
        id: { type: string }
        state:
          type: string
          enum:
            - created
            - ready_for_lunchrush
            - offered
            - assigned
            - picked_up
            - delivered
            - declined
            - expired
            - canceled
        courier_id: { type: string, nullable: true }
    Courier:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        available: { type: boolean }
